services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: machine_failure_backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - FRONTEND_URL=http://localhost:8501
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: machine_failure_frontend
    ports:
      - "8501:8501"
    environment:
      # Key change: inside Docker network, use the service name 'backend'
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
